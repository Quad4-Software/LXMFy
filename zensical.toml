[project]
site_name = "LXMFy"
site_url = "https://lxmfy.quad4.io"
site_description = "Python framework for LXMF bots on the Reticulum Network"
repo_url = "https://github.com/Quad4-Software/LXMFy"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
extra_css = [
  "stylesheets/void.css",
]
extra_javascript = [
  "javascripts/pwa.js",
]
nav = [
  { "Home" = "index.md" },
  { "Quick Start" = "quick-start.md" },
  { "Creating Bots" = "creating-bots.md" },
  { "API Reference" = "api-reference.md" },
  { "Languages" = [
    { "Deutsch" = [
      "de/index.md",
      "de/quick-start.md",
      "de/creating-bots.md",
      "de/api-reference.md",
    ] },
    { "Español" = [
      "es/index.md",
      "es/quick-start.md",
      "es/creating-bots.md",
      "es/api-reference.md",
    ] },
    { "Français" = [
      "fr/index.md",
      "fr/quick-start.md",
      "fr/creating-bots.md",
      "fr/api-reference.md",
    ] },
    { "Português" = [
      "pt/index.md",
      "pt/quick-start.md",
      "pt/creating-bots.md",
      "pt/api-reference.md",
    ] },
    { "Українська" = [
      "uk/index.md",
      "uk/quick-start.md",
      "uk/creating-bots.md",
      "uk/api-reference.md",
    ] },
    { "Русский" = [
      "ru/index.md",
      "ru/quick-start.md",
      "ru/creating-bots.md",
      "ru/api-reference.md",
    ] },
    { "简体中文" = [
      "zh/index.md",
      "zh/quick-start.md",
      "zh/creating-bots.md",
      "zh/api-reference.md",
    ] },
  ] },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.footer",
  "navigation.top",
  "toc.integrate",
  "content.action.edit",
  "search.highlight",
]
font.text = "Space Grotesk"
font.code = "Space Mono"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"

# Dark "void" first so the no-JS default matches quad4.io
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "void"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "paper"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.plugins.mkdocstrings]
